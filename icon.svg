<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Arrière-plan radial sombre et dynamique -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a183d"/>
      <stop offset="60%" stop-color="#050914"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>

    <!-- Gradient principal du "M" lumineux -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ce0ff"/>
      <stop offset="50%" stop-color="#4fb2ff"/>
      <stop offset="100%" stop-color="#1b4dff"/>
    </linearGradient>

    <!-- Gradient secondaire pour le noeud neural -->
    <linearGradient id="accentGradient" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#4fb2ff"/>
      <stop offset="100%" stop-color="#143cb4"/>
    </linearGradient>

    <!-- Effet Glowing Neon Ultime -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Halo lumineux ambiant -->
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <!-- Fond arrondi PWA avec bordure effet verre (Glassmorphism) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(140,200,255,0.22)" stroke-width="3"/>

  <!-- Orbe de lueur centrale derrière le logo -->
  <circle cx="256" cy="256" r="140" fill="#1b4dff" opacity="0.45" filter="url(#ambientGlow)"/>
  <circle cx="200" cy="180" r="90" fill="#4fb2ff" opacity="0.3" filter="url(#ambientGlow)"/>

  <!-- Structure Graphique : Le "M" Quantique / Cybernétique avec Lueur Néon -->
  <g filter="url(#neonGlow)">
    <!-- Tracé principal du M géométrique et fluide -->
    <path d="M 128 368 
             V 164 
             C 128 148, 142 138, 158 146 
             L 242 192 
             C 251 197, 261 197, 270 192 
             L 354 146 
             C 370 138, 384 148, 384 164 
             V 368" 
          fill="none" 
          stroke="url(#primaryGradient)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Connexion Intelligente / Nœud Neural central en forme d'étincelle/diamant -->
    <path d="M 256 220 
             L 276 270 
             L 326 290 
             L 276 310 
             L 256 360 
             L 236 310 
             L 186 290 
             L 236 270 Z" 
          fill="url(#accentGradient)"/>
  </g>

  <!-- Points de connexion IA luminescents -->
  <circle cx="128" cy="164" r="10" fill="#ffffff"/>
  <circle cx="384" cy="164" r="10" fill="#ffffff"/>
  <circle cx="256" cy="290" r="6" fill="#04060e"/>
</svg>
