<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MNL IA</title>
<meta name="description" content="MNL IA — ton assistant personnel.">
<meta name="theme-color" content="#04030f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MNL IA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg" aria-hidden="true"><i class="grid"></i><i class="glow"></i></div>

<div id="app" data-state="idle">
  <header class="top">
    <span class="word">MNL<em>IA</em></span>
    <div class="actions">
      <button class="ib" id="btnFs" title="Plein écran">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button class="ib" id="btnInstall" title="Installer" hidden>
        <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>
      </button>
      <button class="ib" id="btnLab" title="Atelier : m'apprendre des choses">
        <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg>
      </button>
      <button class="ib" id="btnNew" title="Nouvelle conversation">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="ib" id="btnSettings" title="Réglages">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <section id="stage">
    <canvas id="orb" role="button" tabindex="0" aria-label="MNL IA : touche pour parler"></canvas>
    <div id="hello">
      <h2 id="greet">Bonjour</h2>
      <p>Touche l'orbe pour parler</p>
    </div>
    <div id="vui" aria-live="polite">
      <p id="vstate"></p>
      <p id="vcap"></p>
    </div>
    <button class="vclose" id="vClose" aria-label="Quitter le mode voix">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </section>

  <main id="chat" aria-live="polite"></main>

  <footer class="composer">
    <div class="bar">
      <textarea id="input" rows="1" placeholder="Écris ou parle…" enterkeyhint="send"></textarea>
      <button class="ib act" id="btnAct" data-mode="voice" title="Parler / envoyer">
        <svg viewBox="0 0 24 24" id="icoVoice"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>
        <svg viewBox="0 0 24 24" id="icoSend" hidden><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <svg viewBox="0 0 24 24" id="icoStop" hidden><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>
      </button>
    </div>
  </footer>
</div>

<!-- Atelier : ici tu m'enseignes -->
<dialog id="lab">
  <div class="lab-head">
    <div>
      <h3>Atelier</h3>
      <p>Enseigne-moi. J'applique.</p>
    </div>
    <button class="ib" id="labClose" type="button" aria-label="Fermer">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="mem" id="mem"><i id="memBar"></i></div>
  <p class="memtxt" id="memTxt"></p>

  <form id="labForm" autocomplete="off">
    <input type="text" id="lTitle" placeholder="Quand… (ex : « fais le bilan »)" maxlength="80">
    <div class="ta">
      <textarea id="lText" rows="4" placeholder="Explique-moi comment faire, étape par étape…"></textarea>
      <button class="ib" type="button" id="lMic" title="Dicter">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
    </div>
    <div class="lbtns">
      <button type="button" class="ghost" id="lCancel" hidden>Annuler</button>
      <button type="submit" class="primary" id="lSave">Apprendre</button>
    </div>
  </form>

  <ul id="lessons"></ul>
</dialog>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <label>Prénom
      <input type="text" id="setName" placeholder="Comment dois-je t'appeler ?" autocomplete="off">
    </label>

    <label>Clé Groq
      <input type="password" id="setKey" placeholder="gsk_…" autocomplete="off" spellcheck="false">
    </label>

    <label>Modèle
      <select id="setModel"></select>
    </label>

    <label id="voiceField">Voix
      <select id="setVoice"></select>
    </label>

    <div class="field">Couleur<div id="swatches"></div></div>

    <label>Personnalité
      <textarea id="setPersona" rows="2" placeholder="Ex : drôle, très direct, répond en lingala et français"></textarea>
    </label>

    <label class="row">
      <input type="checkbox" id="setSpeak">
      <span>Répondre à voix haute</span>
    </label>

    <div class="btns">
      <button type="button" class="danger" id="btnWipe">Effacer</button>
      <span class="grow"></span>
      <button type="button" class="ghost" id="btnCancel">Fermer</button>
      <button type="submit" class="primary" value="save">Enregistrer</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
