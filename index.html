<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MNL IA</title>
<meta name="theme-color" content="#04030f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04030f; --fg:#e9eeff; --muted:#6f7aa6; --stroke:rgba(255,255,255,.1);
  --a:rgb(139,92,246); --b:rgb(34,211,238); --a-rgb:139,92,246; --b-rgb:34,211,238;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);overflow:hidden;font:16px/1.6 "Space Grotesk",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:46px 46px}
.bg .glow{position:absolute;left:50%;top:-10%;width:140vmax;height:90vmax;transform:translateX(-50%);background:radial-gradient(ellipse 40% 34% at 50% 38%,rgba(var(--a-rgb),.2),transparent 70%);animation:sway 14s ease-in-out infinite alternate}
@keyframes sway{to{transform:translateX(-46%) scale(1.08)}}
#app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 12px 4px 20px}
.word{font-weight:700;font-size:13px;letter-spacing:.38em;text-transform:uppercase}
.word em{font-style:normal;margin-left:.45em;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.actions{display:flex;gap:2px}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;transition:background .2s}
.ib:hover{background:rgba(255,255,255,.08)}
.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#stage{position:relative;flex:none;height:44dvh;max-height:420px;transition:height .7s}
#stage.small{height:92px}
#orb{display:block;width:100%;height:100%;cursor:pointer;outline:0}
#hello{position:absolute;left:0;right:0;bottom:0;text-align:center;transition:opacity .45s}
#stage.small #hello{opacity:0;pointer-events:none}
#hello h2{font-size:clamp(26px,7vw,34px);font-weight:500;background:linear-gradient(90deg,#fff,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
#hello p{margin-top:4px;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
#chat{flex:1;min-height:0;overflow-y:auto;padding:6px 20px 14px;scroll-behavior:smooth}
.msg{margin:18px 0}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{max-width:84%;padding:9px 16px;border-radius:20px 20px 4px 20px;border:1px solid rgba(var(--a-rgb),.55);background:rgba(var(--a-rgb),.1)}
.msg.model .bubble{padding:0 2px 0 15px;font-size:16.5px;color:#e6ebff;border-left:2px solid var(--a)}
.dots{display:inline-flex;gap:5px;padding:7px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));animation:bounce 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-6px);opacity:1}}
.composer{padding:6px 14px calc(12px + env(safe-area-inset-bottom))}
.bar{display:flex;align-items:flex-end;gap:2px;padding:5px;border-radius:32px;background:#080618;border:1px solid var(--stroke);box-shadow:0 0 34px -12px rgba(var(--a-rgb),.7)}
#input{flex:1;min-width:0;resize:none;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;padding:10px 6px;max-height:140px}
#input::placeholder{color:var(--muted)}
.act{background:linear-gradient(135deg,var(--a),var(--b));color:#04030f;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;border:0}
.act svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
dialog{margin:auto;border:1px solid var(--stroke);border-radius:26px;padding:22px;width:min(92vw,440px);background:rgba(10,8,28,.96);color:var(--fg)}
dialog::backdrop{background:rgba(2,1,12,.7)}
dialog label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;margin-top:14px}
dialog input,dialog select,dialog textarea{display:block;width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--stroke);background:rgba(255,255,255,.05);color:var(--fg);font:inherit;outline:0}
dialog select option{background:#0a081c}
.btns{display:flex;gap:8px;margin-top:18px}
.btns button{border:0;border-radius:999px;padding:10px 18px;font-weight:500}
.btns .primary{background:linear-gradient(135deg,var(--a),var(--b));color:#04030f;font-weight:700}
.btns .ghost{background:rgba(255,255,255,.09)}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:rgba(10,8,28,.96);border:1px solid var(--stroke);padding:8px 16px;border-radius:999px;font-size:14px;transition:.3s}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="bg"><i class="grid"></i><i class="glow"></i></div>

<div id="app">
  <header class="top">
    <span class="word">MNL<em>IA</em></span>
    <div class="actions">
      <button class="ib" id="btnNew" title="Nouvelle conversation"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ib" id="btnSettings" title="Réglages"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
    </div>
  </header>

  <section id="stage">
    <canvas id="orb"></canvas>
    <div id="hello">
      <h2 id="greet">Bonjour</h2>
      <p>Touche l'orbe pour parler</p>
    </div>
  </section>

  <main id="chat"></main>

  <footer class="composer">
    <div class="bar">
      <textarea id="input" rows="1" placeholder="Écris ou parle…"></textarea>
      <button class="act" id="btnAct"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </footer>
</div>

<dialog id="settings">
  <form method="dialog">
    <label>Prénom</label>
    <input type="text" id="setName" placeholder="Ton prénom">
    <label>Clé API Groq</label>
    <input type="password" id="setKey" placeholder="gsk_...">
    <label>Modèle</label>
    <select id="setModel">
      <option value="gpt-oss-120b">GPT-OSS 120B</option>
      <option value="gpt-oss-20b">GPT-OSS 20B</option>
      <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
    </select>
    <label>Mémoire Personnalisée & Base Perso</label>
    <textarea id="setCustomKnowledge" rows="3" placeholder="Tes informations privées..."></textarea>
    <div class="btns">
      <button type="button" class="ghost" id="btnCancel">Fermer</button>
      <button type="button" class="primary" id="btnSave">Enregistrer</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const chat = $('#chat'), input = $('#input'), btnAct = $('#btnAct'), dlg = $('#settings');
  
  let settings = JSON.parse(localStorage.getItem('mnl_settings') || '{"apiKey":"","model":"gpt-oss-120b","name":"","customKnowledge":""}');
  let history = JSON.parse(localStorage.getItem('mnl_history') || '[]');

  // Orbe
  const cv = $('#orb'), ctx = cv.getContext('2d');
  let W = 0, H = 0, t = 0;
  function resize() {
    const r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = W * 2; cv.height = H * 2;
  }
  window.addEventListener('resize', resize); resize();

  function draw() {
    requestAnimationFrame(draw);
    t += 0.03;
    ctx.setTransform(2,0,0,2,0,0);
    ctx.clearRect(0,0,W,H);
    const cx = W/2, cy = H/2, R = Math.min(W,H)*0.3;
    let g = ctx.createRadialGradient(cx, cy, 10, cx, cy, R*1.2);
    g.addColorStop(0, 'rgba(139,92,246,0.5)');
    g.addColorStop(1, 'rgba(34,211,238,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R*1.2, 0, Math.PI*2); ctx.fill();
    
    ctx.fillStyle = '#fff';
    for(let i=0; i<60; i++) {
      let th = i * 0.1 + t, x = cx + Math.cos(th) * R * (0.8 + Math.sin(t+i)*0.2), y = cy + Math.sin(th*0.7) * R * 0.6;
      ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI*2); ctx.fill();
    }
  }
  requestAnimationFrame(draw);

  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function addMsg(role, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    d.innerHTML = '<div class="bubble">' + text.replace(/\n/g, '<br>') + '</div>';
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    $('#stage').classList.toggle('small', chat.children.length > 0);
  }

  history.forEach(m => addMsg(m.role, m.content));

  async function send() {
    const text = input.value.trim();
    if(!text) return;
    if(!settings.apiKey) { openSettings(); return; }
    input.value = '';
    
    history.push({role: 'user', content: text});
    addMsg('user', text);
    
    const bot = document.createElement('div');
    bot.className = 'msg model';
    bot.innerHTML = '<div class="bubble"><span class="dots"><i></i><i></i><i></i></span></div>';
    chat.appendChild(bot);
    chat.scrollTop = chat.scrollHeight;

    try {
      let sys = "Tu es MNL IA." + (settings.name ? " L'utilisateur s'appelle " + settings.name + "." : "");
      if(settings.customKnowledge) sys += "\nBase perso : " + settings.customKnowledge;

      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + settings.apiKey},
        body: JSON.stringify({
          model: settings.model || 'gpt-oss-120b',
          messages: [{role: 'system', content: sys}, ...history]
        })
      });
      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content || "Erreur de réponse.";
      
      history.push({role: 'assistant', content: reply});
      localStorage.setItem('mnl_history', JSON.stringify(history.slice(-50)));
      bot.querySelector('.bubble').textContent = reply;
    } catch(e) {
      bot.querySelector('.bubble').textContent = "Erreur de connexion.";
    }
  }

  btnAct.onclick = send;
  input.onkeypress = e => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };

  $('#btnSettings').onclick = () => {
    $('#setName').value = settings.name || '';
    $('#setKey').value = settings.apiKey || '';
    $('#setModel').value = settings.model || 'gpt-oss-120b';
    $('#setCustomKnowledge').value = settings.customKnowledge || '';
    dlg.showModal();
  };
  $('#btnCancel').onclick = () => dlg.close();
  $('#btnSave').onclick = () => {
    settings.name = $('#setName').value.trim();
    settings.apiKey = $('#setKey').value.trim();
    settings.model = $('#setModel').value;
    settings.customKnowledge = $('#setCustomKnowledge').value.trim();
    localStorage.setItem('mnl_settings', JSON.stringify(settings));
    dlg.close();
    toast('Enregistré ✓');
  };
  $('#btnNew').onclick = () => { history = []; localStorage.removeItem('mnl_history'); chat.innerHTML=''; $('#stage').classList.remove('small'); };

  if(!settings.apiKey) setTimeout(openSettings, 500);
})();
</script>
</body>
</html>
