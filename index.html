<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MNL IA</title>
<meta name="description" content="MNL IA — ton assistant personnel.">
<meta name="theme-color" content="#04030f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MNL IA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg" aria-hidden="true"><i class="grid"></i><i class="glow"></i></div>

<div id="app" data-state="idle">
  <header class="top">
    <span class="word">MNL<em>IA</em></span>
    <div class="actions">
      <button class="ib" id="btnInstall" title="Installer" hidden>
        <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>
      </button>
      <button class="ib" id="btnNew" title="Nouvelle conversation">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="ib" id="btnSettings" title="Réglages">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <section id="stage">
    <canvas id="orb" role="button" tabindex="0" aria-label="MNL IA : touche pour parler"></canvas>
    <div id="hello">
      <h2 id="greet">Bonjour</h2>
      <p>Touche l'orbe pour parler</p>
    </div>
  </section>

  <main id="chat" aria-live="polite"></main>

  <footer class="composer">
    <div id="preview"></div>
    <div class="bar">
      <button class="ib" id="btnAttach" title="Joindre une image">
        <svg viewBox="0 0 24 24"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.4-8.4"/></svg>
      </button>
      <input type="file" id="file" accept="image/*" hidden>
      <textarea id="input" rows="1" placeholder="Écris ou parle…" enterkeyhint="send"></textarea>
      <button class="ib act" id="btnAct" data-mode="mic" title="Envoyer / parler">
        <svg viewBox="0 0 24 24" id="icoMic"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <svg viewBox="0 0 24 24" id="icoSend" hidden><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <svg viewBox="0 0 24 24" id="icoStop" hidden><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>
      </button>
    </div>
  </footer>
</div>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <label>Prénom
      <input type="text" id="setName" placeholder="Comment dois-je t'appeler ?" autocomplete="off">
    </label>

    <label>Clé Gemini
      <input type="password" id="setKey" placeholder="AQ.Ab8RN6JyryDcUPM85Plmu3z17gXpu-66av9EfulI0kqNfyJ4qQ" autocomplete="off" spellcheck="false">
    </label>

    <label>Modèle
      <select id="setModel"></select>
    </label>

    <div class="field">Couleur<div id="swatches"></div></div>

    <label>Personnalité
      <textarea id="setPersona" rows="2" placeholder="Ex : drôle, très direct, répond en lingala et français"></textarea>
    </label>

    <label class="row">
      <input type="checkbox" id="setSpeak">
      <span>Répondre à voix haute</span>
    </label>

    <div class="btns">
      <button type="button" class="danger" id="btnWipe">Effacer</button>
      <span class="grow"></span>
      <button type="button" class="ghost" id="btnCancel">Fermer</button>
      <button type="submit" class="primary" value="save">Enregistrer</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
